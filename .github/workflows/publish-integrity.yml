name: Publish HGD Integrity

on:
  workflow_dispatch:

permissions: {}

jobs:
  validate-sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.2
      - name: Validate public bundles before signing
        run: |
          node verify/hgd-verify.mjs records/cmd-001 --skip-signature
          node verify/hgd-verify.mjs records/cmd-002 --skip-signature
          node verify/hgd-verify.mjs records/cmd-002-v2 --skip-signature
          node verify/hgd-verify.mjs records/cmd-002-v3 --skip-signature
      - name: Sign superseding CMD-002 v3 manifest
        run: |
          cosign sign-blob records/cmd-002-v3/hgd-integrity-manifest-v2.json --bundle records/cmd-002-v3/hgd-integrity-manifest-v2.sigstore.json --yes
      - name: Verify signed superseding bundle
        run: |
          node verify/hgd-verify.mjs records/cmd-002-v3
      - name: Upload signed release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hgd-cmd-002-integrity-v3-signed-release-payload
          path: |
            records/cmd-002-v3/record.json
            records/cmd-002-v3/brief.json
            records/cmd-002-v3/chart_cross_asset_growth_common_window.svg
            records/cmd-002-v3/chart_cross_asset_growth_common_window_1x.png
            records/cmd-002-v3/chart_cross_asset_growth_common_window_2x.png
            records/cmd-002-v3/chart_cross_asset_drawdown_common_window.svg
            records/cmd-002-v3/chart_cross_asset_drawdown_common_window_1x.png
            records/cmd-002-v3/chart_cross_asset_drawdown_common_window_2x.png
            records/cmd-002-v3/hgd-integrity-manifest-v2.json
            records/cmd-002-v3/hgd-integrity-manifest-v2.sigstore.json
            records/cmd-002-v3/SHA256SUMS
            records/cmd-002-v3/verification-receipt.json
            records/cmd-002-v3/supersession-receipt.json
            records/cmd-002-v3/README.md
  publish-release:
    needs: validate-sign
    runs-on: ubuntu-latest
    environment: integrity-publish
    permissions:
      contents: write
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download signed release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: hgd-cmd-002-integrity-v3-signed-release-payload
          path: signed-payload
      - name: Install cosign for release verification
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.2
      - name: Verify payload hashes and signatures
        run: |
          cp signed-payload/hgd-integrity-manifest-v2.sigstore.json records/cmd-002-v3/
          node verify/hgd-verify.mjs records/cmd-002-v3
      - name: Create CMD-002 v3 public integrity release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create hgd-cmd-002-integrity-v3 signed-payload/* --draft --title "HGD CMD-002 Integrity v3" --notes "Weekly Market Brief 002 revision 4 supersedes revision 3. HGD Record 002 and its certified decision did not change. Prior releases remain available and independently verifiable as historical publication evidence."
          gh release edit hgd-cmd-002-integrity-v3 --draft=false
