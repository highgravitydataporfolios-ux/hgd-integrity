name: Publish HGD Integrity

on:
  workflow_dispatch:

permissions: {}

jobs:
  validate-sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.2
      - name: Validate public bundles before signing
        run: |
          node verify/hgd-verify.mjs records/cmd-001 --skip-signature
          node verify/hgd-verify.mjs records/cmd-002 --skip-signature
      - name: Sign canonical manifests
        run: |
          cosign sign-blob records/cmd-001/hgd-integrity-manifest-v1.json --bundle records/cmd-001/hgd-integrity-manifest-v1.sigstore.json --yes
          cosign sign-blob records/cmd-002/hgd-integrity-manifest-v1.json --bundle records/cmd-002/hgd-integrity-manifest-v1.sigstore.json --yes
      - name: Verify signed bundles
        run: |
          node verify/hgd-verify.mjs records/cmd-001
          node verify/hgd-verify.mjs records/cmd-002
      - name: Upload signed release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hgd-integrity-signed-release-payload
          path: |
            records/cmd-001/record.json
            records/cmd-001/brief.json
            records/cmd-001/hgd-integrity-manifest-v1.json
            records/cmd-001/hgd-integrity-manifest-v1.sigstore.json
            records/cmd-001/SHA256SUMS
            records/cmd-001/verification-receipt.json
            records/cmd-001/README.md
            records/cmd-002/record.json
            records/cmd-002/brief.json
            records/cmd-002/hgd-integrity-manifest-v1.json
            records/cmd-002/hgd-integrity-manifest-v1.sigstore.json
            records/cmd-002/SHA256SUMS
            records/cmd-002/verification-receipt.json
            records/cmd-002/README.md
  publish-release:
    needs: validate-sign
    runs-on: ubuntu-latest
    environment: integrity-publish
    permissions:
      contents: write
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download signed release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: hgd-integrity-signed-release-payload
          path: signed-payload
      - name: Verify payload hashes and signatures
        run: |
          cp signed-payload/records/cmd-001/hgd-integrity-manifest-v1.sigstore.json records/cmd-001/
          cp signed-payload/records/cmd-002/hgd-integrity-manifest-v1.sigstore.json records/cmd-002/
          node verify/hgd-verify.mjs records/cmd-001
          node verify/hgd-verify.mjs records/cmd-002
      - name: Create CMD-001 draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create hgd-cmd-001-integrity-v1 signed-payload/records/cmd-001/* --draft --title "HGD CMD-001 Integrity v1" --notes "Registration type: RETROACTIVE_AFTER_PUBLIC_RELEASE. Integrity registration occurred after this CMD's original public release."
          gh release edit hgd-cmd-001-integrity-v1 --draft=false
      - name: Create CMD-002 draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create hgd-cmd-002-integrity-v1 signed-payload/records/cmd-002/* --draft --title "HGD CMD-002 Integrity v1" --notes "Registration type: PRE_PUBLIC_WEB_RELEASE_INITIAL_REGISTRATION. Integrity registration occurred before this CMD's first production website release."
          gh release edit hgd-cmd-002-integrity-v1 --draft=false
